<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台任务队列 · 观测台</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --green:#3fb950; --blue:#58a6ff; --orange:#d29922; --red:#f85149; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  a { color: var(--blue); text-decoration: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .kv:last-child { border-bottom: none; }
  .kv b { font-weight: 600; text-align: right; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .ok { color: var(--green); } .warn { color: var(--orange); } .bad { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  td { padding: 5px 6px; border-bottom: 1px dashed var(--border); vertical-align: top; }
  .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 11px; line-height: 18px; }
  .pill.free { background: #12331c; color: var(--green); }
  .pill.paid { background: #3a2410; color: var(--orange); }
  .status-running { color: var(--blue); } .status-done { color: var(--green); } .status-error { color: var(--red); } .status-queued, .status-starting { color: var(--orange); }
  #dispatch { display: flex; gap: 8px; margin-top: 10px; }
  #dispatch input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; outline: none; }
  #dispatch input:focus { border-color: var(--blue); }
  button { background: #238636; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2ea043; }
  .refresh-info { color: var(--muted); font-size: 11px; }
  .err { color: var(--red); font-size: 12px; }
</style>
</head>
<body>
<h1>🚀 后台任务队列 · 观测台</h1>
<div class="sub">每 5 秒自动刷新 · <span id="lastRefresh">-</span> · <a href="/">回对话</a> · <a href="/docs">API 文档</a></div>
<div class="grid">
  <div class="card"><h2>🏥 平台健康</h2><div id="health">加载中…</div></div>
  <div class="card"><h2>⚙️ 并发与队列</h2><div id="stats">加载中…</div></div>
  <div class="card"><h2>📚 RAG 知识库</h2><div id="rag">加载中…</div></div>
  <div class="card"><h2>🏪 服务商（标签=助手派活参考）</h2><div id="providers">加载中…</div></div>
  <div class="card"><h2>🐂 工人岗矩阵</h2><div id="agents">加载中…</div></div>
  <div class="card"><h2>💰 今日 Token 消耗（助手平台）</h2><div id="usage">加载中…</div></div>
  <div class="card" style="grid-column: 1 / -1;"><h2>📋 后台任务流水（📣=已自动汇报）</h2>
    <table><thead><tr><th>单号</th><th>状态</th><th>任务</th><th>结果摘要</th><th>发起对话</th></tr></thead><tbody id="tasks"><tr><td colspan="5" style="color:var(--muted)">加载中…</td></tr></tbody></table>
    <div id="dispatch">
      <input id="taskInput" placeholder="手动派一单测试活，如：用 execute 执行 echo hello" onkeydown="if(event.key==='Enter')dispatchTask()">
      <button onclick="dispatchTask()">派活</button>
    </div>
    <div id="dispatchMsg" class="refresh-info"></div>
  </div>
</div>
<script>
const J = u => fetch(u).then(r => r.json());
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function refresh() {
  try {
    const h = await J('/health');
    document.getElementById('health').innerHTML = '<div class="kv"><span>服务</span><b class="ok"><span class="dot" style="background:var(--green)"></span>' + esc(h.service || 'ok') + '</b></div><div class="kv"><span>Agent</span><b>' + esc(h.agent || '-') + '</b></div>';
  } catch (e) { document.getElementById('health').innerHTML = '<span class="bad">后端不可达</span>'; }
  try {
    const s = await J('/stats');
    const st = s.statuses || {'运行中': s['运行中'], '排队中': s['排队中'], '已完成': s['已完成'], '失败': s['失败']};
    const rows = Object.entries(st).map(([k, v]) => '<div class="kv"><span>' + esc(k) + '</span><b>' + v + '</b></div>').join('');
    document.getElementById('stats').innerHTML = (rows || '<div class="kv"><span>空闲</span><b>0</b></div>');
  } catch (e) { document.getElementById('stats').innerHTML = '<span class="err">读取失败</span>'; }
  try {
    const r = await J('/rag/stats');
    const docs = Object.entries(r.docs || {}).map(([k, v]) => '<div class="kv"><span>' + esc(k) + '</span><b>' + v + ' 片</b></div>').join('');
    document.getElementById('rag').innerHTML = '<div class="kv"><span>总切片</span><b>' + r.chunks + '</b></div>' + (docs || '<div class="kv"><span>空库</span><b>-</b></div>');
  } catch (e) { document.getElementById('rag').innerHTML = '<span class="err">读取失败</span>'; }
  try {
    const s = await J('/settings');
    const provs = s.external?.providers || [];
    document.getElementById('providers').innerHTML = provs.map(p =>
      '<div class="kv"><span>' + esc(p.name) + '</span><b>' + (p.enabled === false ? '<span class="err">停用</span>' : (p.tag === '付费' ? '<span class="pill paid">付费</span>' : '<span class="pill free">免费</span>')) + '</b></div>').join('');
    document.getElementById('agents').innerHTML = Object.entries(s.agents || {}).map(([k, a]) => {
      const tag = (provs.find(x => x.name === a.provider) || {}).tag || '';
      return '<div class="kv"><span>' + esc(k) + '</span><b>' + esc(a.model || '') + '</b><span class="refresh-info">' + esc(a.provider || '') + (tag === '付费' ? ' <span class="pill paid">付费</span>' : '') + '</span></div>';
    }).join('');
  } catch (e) { document.getElementById('providers').innerHTML = document.getElementById('agents').innerHTML = '<span class="err">读取失败</span>'; }
  try {
    const t = await J('/tasks/list');
    const rows = (t.tasks || []).slice().reverse().map(x =>
      '<tr><td>' + esc(x.id) + '</td><td><span class="status-' + esc(x.status) + '">' + esc(x.status) + '</span>' + (x.reported ? ' 📣' : '') + '</td><td>' + esc((x.task || '').slice(0, 60)) + '</td><td>' + esc((x.result || '').slice(0, 80)) + '</td><td>' + (x.main_thread ? esc(String(x.main_thread).slice(0, 8)) + '…' : '-') + '</td></tr>').join('');
    document.getElementById('tasks').innerHTML = rows || '<tr><td colspan="5" style="color:var(--muted)">暂无任务</td></tr>';
  } catch (e) { document.getElementById('tasks').innerHTML = '<tr><td colspan="5" class="err">读取失败</td></tr>'; }
  // 今日 token 消耗
  try {
    const u = await J('/usage/today');
    const rows = Object.entries(u.by_model || {}).map(([m, a]) =>
      '<div class="kv"><span>' + esc(m) + '</span><b>' + a.total.toLocaleString() + ' tok / ' + a.calls + ' 次</b></div>').join('');
    document.getElementById('usage').innerHTML = '<div class="kv"><span>今日合计</span><b class="ok">' + (u.total?.total || 0).toLocaleString() + ' tok / ' + (u.total?.calls || 0) + ' 次</b></div>' + rows;
  } catch (e) { document.getElementById('usage').innerHTML = '<span class="err">读取失败</span>'; }
  document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();
}
async function dispatchTask() {
  const v = document.getElementById('taskInput').value.trim();
  if (!v) return;
  document.getElementById('dispatchMsg').textContent = '派发中…';
  try {
    const r = await fetch('/tasks/dispatch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task: v }) });
    const out = await r.json();
    document.getElementById('dispatchMsg').textContent = out.ok ? '已派活：' + out.id : '失败：' + (out.error || '');
    if (out.ok) document.getElementById('taskInput').value = '';
  } catch (e) { document.getElementById('dispatchMsg').textContent = '请求失败：' + e.message; }
  refresh();
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
